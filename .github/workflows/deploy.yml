name: TrimLink CI/CD

on:
  push:
    branches:
        - main

jobs:
  build-and-deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
      
        - name: Setup Java 25
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '25'
            cache: maven

        - name: Build Project
          run: mvn clean package

        - name: Copy War to Ubuntu
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USERNAME }}
            key: ${{ secrets.SSH_KEY }}
            source: "target/TrimLink-0.0.1-SNAPSHOT.war"
            target: "/tmp"

        - name: Deploy WAR
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USERNAME }}
            key: ${{ secrets.SSH_KEY }}
            script: |
              sudo cp /tmp/target/TrimLink-0.0.1-SNAPSHOT.war /var/lib/tomcat10/webapps
              sudo systemctl restart tomcat10
